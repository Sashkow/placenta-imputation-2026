# GA-matched re-analysis for the Prater 2021 cross-technology comparison.
# Reproduces Supplementary Section 5: 31 first-trimester samples at 7-8 weeks
# (GSE100051, GSE122214, GSE93520, GSE9984) vs 5 second-trimester samples at
# week 14 (GSE100051); 11,761 testable genes, 602 DEGs, Prater r = 0.807.

paths:
  mapped_data: "data/expression"
  phenodata: "data/phenodata.tsv"
  output: "data/pipeline/ga_matched_prater"
  column_map:
    arraydatafile_exprscolumnnames: "sample_id"
    secondaryaccession: "dataset_id"
    Gestational.Age.Category: "trimester"
    Diagnosis: "condition"

files:
  suffix: ""
  file_map:
    GSE28551: "GSE28551.tsv"
  datasets:
    - "GSE100051"
    - "GSE122214"
    - "GSE93520"
    - "GSE9984"

sample_filter:
  condition: ["healthy"]
  trimester: ["First trimester", "Second trimester"]

# Restrict to Prater et al. (2021)'s gestational-age windows:
# 7-8 weeks (their first-trimester arm) vs 13-14 weeks (their early
# second-trimester arm). GSE28551 (weeks 9-12) and GSE37901 (weeks 17-19)
# contribute no samples inside either window and are dropped above.
ga_filter:
  "First trimester": [7, 8]
  "Second trimester": [13, 14]

phenotype:
  group_column: "trimester"
  baseline: "First trimester"
  contrast: "Second trimester"
  covariates: ["fetux_sex_estimate"]
  # No continuous-GA ComBat term here: within the matched windows GA takes
  # only the values 7, 7.5, 8 and 14, so a linear GA term is nearly collinear
  # with the trimester contrast. ComBat models the categorical group instead.

imputation:
  softimpute:
    enabled: true
    rank_max: 30
    lambda: 0
    thresh: 1e-4
    maxit: 50
    type: "als"
    seed: 42  # ALS starts from a random matrix; fixed seed makes runs repeatable
  none:
    enabled: true

normalization:
  combat_ref:
    enabled: true
    ref_batch: "GSE100051"

coverage:
  min_datasets: 1
  drop_imputed_genes_missing_in_group: true

de:
  imputed_cell_weight: 0.0

thresholds:
  fdr: 0.05
  logfc: 1.0

gene_filter:
  protein_coding_only: true
  # min_variance: 0.01   # not read by the pipeline; retained for documentation only

validation:
  leave_out_fraction: 0.1
  n_repeats: 3
  mask_type: "gene_dataset_block"

output:
  save_imputed_matrices: true
  save_normalized_matrices: true
  save_validation_report: true
  save_comparison_plots: true
