# Hold-out selection of the softImpute lambda (Mazumder, Hastie & Tibshirani
# 2010): the production warm-start path (8 geometric steps from lambda0 to
# 0.01 * lambda0) is fitted on masked copies of the merged matrix and scored on
# the hidden cells at every step. The step chosen by the one-SE rule on the
# gene--dataset block masks is the `path_stop_step` set in every pipeline
# config. The selection masks use their own seeds, distinct from the
# Table S1/S3 holdout masks (seeds 123, 246, 369), so the reported accuracy is
# not measured on the cells that chose lambda.
#
# Run:  Rscript scripts/lambda_selection_path.R
#
paths:
  companion: "."
  mapped_data: "data/expression"
  phenodata: "data/phenodata.tsv"
  reference_de: "data/pipeline/main/difexp_softimpute_combat_ref.tsv"
  census: "data/pipeline/test4/coverage_patterns_all.csv"
  cv_comparators: "data/pipeline/cv_comparators/table_s1_cv_comparators.csv"
  output: "data/pipeline/lambda_selection"
  holdout_masks: "data/pipeline/holdout/main/masks"
  column_map:
    arraydatafile_exprscolumnnames: "sample_id"
    secondaryaccession: "dataset_id"
    Gestational.Age.Category: "trimester"
    Diagnosis: "condition"

files:
  suffix: ""
  file_map:
    GSE28551: "GSE28551.tsv"
  datasets:
    - "GSE100051"
    - "GSE122214"
    - "GSE28551"
    - "GSE37901"
    - "GSE93520"
    - "GSE9984"

sample_filter:
  condition: ["healthy"]
  trimester: ["First trimester", "Second trimester"]

phenotype:
  group_column: "trimester"
  baseline: "First trimester"
  contrast: "Second trimester"
  covariates: ["fetus_sex_estimate"]
  combat_bio_covariate: "ga_weeks"

# softImpute settings of the production fit; the full 8-step path is fitted
# here (path_stop_step is what this run selects). imputePCA settings other
# than ncp, which is varied over lambda_selection.missmda_ncp.
imputation:
  softimpute:
    rank_max: 60
    lambda: 0
    thresh: 1.0e-4
    maxit: 50
    type: "als"
    seed: 42
  missmda:
    scale: true
    method: "Regularized"

normalization:
  combat_ref:
    enabled: true
    ref_batch: "GSE100051"

coverage:
  min_datasets: 1
  # production drops genes with no real measurement in one comparison group
  # BEFORE imputation; the same drop is applied here, before masks are drawn
  drop_imputed_genes_missing_in_group: true

de:
  imputed_cell_weight: 0.0

thresholds:
  fdr: 0.05
  logfc: 1.0

lambda_selection:
  # one mask of each scheme per seed; selection uses gene_dataset_block,
  # random_cells is scored for reporting only
  mask_types: ["gene_dataset_block", "random_cells"]
  select_on: "gene_dataset_block"
  seeds: [1001, 1002, 1003]
  leave_out_fraction: 0.1
  min_obs_per_gene: 4
  n_steps: 8
  min_ratio: 0.01
  # parallel masks (each fit holds ~1 GB)
  cores: 3
  # missMDA::imputePCA grid on the same masks (task 2b)
  missmda_ncp: [2, 5, 10, 13, 20, 30]
  # missMDA GCV criterion (estim_ncpPCA's formula) on the full matrix, ncp 1..this
  missmda_gcv_max: 20
  missmda_cores: 5
