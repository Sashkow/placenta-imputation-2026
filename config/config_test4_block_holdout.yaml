# Block-holdout differential-expression validation (test 4).
#
# Takes genes measured on all six platforms -- for which the correct DE answer
# is known -- hides their values following the coverage patterns that real
# imputation-only genes actually have, reruns the pipeline, and checks whether
# the known answer is still reached.
#
# Run with: Rscript scripts/test4_block_holdout_de.R

paths:
  mapped_data: "data/expression"
  phenodata: "data/phenodata.tsv"
  reference_de: "data/pipeline/main/difexp_softimpute_combat_ref.tsv"
  reference_corrected: "data/pipeline/main/exprs_softimpute_combat_ref.tsv"
  reference_imputed: "data/pipeline/main/exprs_imputed_softimpute.tsv"
  output: "data/pipeline/test4"
  column_map:
    arraydatafile_exprscolumnnames: "sample_id"
    secondaryaccession: "dataset_id"
    Gestational.Age.Category: "trimester"
    Diagnosis: "condition"

files:
  suffix: ""
  file_map:
    GSE28551: "GSE28551.tsv"
  datasets:
    - "GSE100051"
    - "GSE122214"
    - "GSE28551"
    - "GSE37901"
    - "GSE93520"
    - "GSE9984"

sample_filter:
  condition: ["healthy"]
  trimester: ["First trimester", "Second trimester"]

phenotype:
  group_column: "trimester"
  baseline: "First trimester"
  contrast: "Second trimester"
  covariates: ["fetux_sex_estimate"]
  combat_bio_covariate: "ga_weeks"

imputation:
  softimpute:
    enabled: true
    rank_max: 30
    lambda: 0
    thresh: 1e-4
    maxit: 50
    type: "als"
    seed: 42

normalization:
  combat_ref:
    enabled: true
    ref_batch: "GSE100051"

coverage:
  min_datasets: 1
  drop_imputed_genes_missing_in_group: true

de:
  imputed_cell_weight: 0.0

thresholds:
  fdr: 0.05
  logfc: 1.0

test4:
  # genes masked per replicate, drawn from the 8,260 intersection genes
  n_genes_per_replicate: 800
  # replicates use disjoint gene sets; each seed reproduces its own draw
  seeds: [4001, 4002, 4003]
  # reference batch, reported as a stratum because its absence forces the
  # ComBat anchor to rest on imputed values
  ref_batch: "GSE100051"
