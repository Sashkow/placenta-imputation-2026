# Subsampling-stability config for the PRIMARY linear-GA ComBat variant.
# Writes to its own directory so the canonical shipped validation outputs in
# data/pipeline/validation/ are never overwritten. Feeds the Linear GA column
# of Supplementary Table S3.

base: validation.yaml

paths:
  reference_de: "data/pipeline/main/difexp_softimpute_combat_ref.tsv"
  reference_imputed: "data/pipeline/main/exprs_imputed_softimpute.tsv"
  output: "data/pipeline/validation_covariate_linear"

